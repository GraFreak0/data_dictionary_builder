[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-dictionary-builder"
version = "0.1.8"
description = "Extract database metadata, generate dbt-compatible YAML, compare schemas, and deliver reports — all in a single Python import."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Isaiah Johnson", email = "d8aguy@mail.com"}
]
keywords = ["database", "metadata", "dbt", "yaml", "data-engineering", "schema", "documentation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# ── Core + all connectors installed by default ────────────────────────────────
# A plain `pip install data-dictionary-builder` gives you everything.
# Use the optional extras below if you want a minimal install.
dependencies = [
    # Core utilities
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "typing-extensions>=4.9.0",
    "python-dateutil>=2.8.2",
    "colorlog>=6.8.0",
    # Database connectors
    "psycopg2-binary>=2.9.9",
    "PyMySQL>=1.1.0",
    "clickhouse-connect>=0.7.0",
    "google-cloud-spanner>=3.40.0",
    # Reporting & email
    "reportlab>=4.0.0",
    "secure-smtplib>=0.1.1",
    "numpy",
    "slack-sdk>=3.41.0",
    "clickhouse-driver>=0.2.10",
]

[project.optional-dependencies]
# Database connectors — install only what you need
postgres    = ["psycopg2-binary>=2.9.9"]
mysql       = ["PyMySQL>=1.1.0"]
clickhouse         = ["clickhouse-connect>=0.7.0"]
clickhouse-native  = ["clickhouse-driver>=0.2.7"]
clickhouse-all     = ["clickhouse-connect>=0.7.0", "clickhouse-driver>=0.2.7"]
spanner     = ["google-cloud-spanner>=3.40.0"]
oracle      = ["oracledb>=2.0.0"]
sqlserver   = ["pymssql>=2.2.0"]
mongodb     = ["pymongo>=4.6.0"]

# ── Reporting & notification extras ──────────────────────────────────────────
pdf               = ["reportlab>=4.0.0"]
email             = ["secure-smtplib>=0.1.1"]
slack             = ["slack-sdk>=3.41.0"]

# ── Install everything ────────────────────────────────────────────────────────
all = [
    "psycopg2-binary>=2.9.9",
    "PyMySQL>=1.1.0",
    "clickhouse-connect>=0.7.0",
    "clickhouse-driver>=0.2.7",        # native TCP transport
    "google-cloud-spanner>=3.40.0",
    "oracledb>=2.0.0",
    "pymssql>=2.2.0",
    "pymongo>=4.6.0",
    "reportlab>=4.0.0",
    "secure-smtplib>=0.1.1",
    "slack-sdk>=3.41.0",
    "numpy",
]

# ── Development tools ─────────────────────────────────────────────────────────
dev = [
    "pytest>=7.4.3",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "mongomock>=4.1.2",
]

[project.urls]
Homepage    = "https://github.com/GraFreak0/data_dictionary_builder"
Repository  = "https://github.com/GraFreak0/data_dictionary_builder"
Issues      = "https://github.com/GraFreak0/data_dictionary_builder/issues"

[project.scripts]
ddgen                  = "data_dictionary_builder.cli:main"
data-dictionary-builder = "data_dictionary_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
