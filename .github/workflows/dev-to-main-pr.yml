name: Dev to Main PR

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create PR
        uses: repo-sync/pull-request@v2
        with:
          source_branch: dev
          destination_branch: main
          pr_title: "Dev → Main Sync"
          pr_body: "Auto PR created after updates to dev."
          github_token: ${{ secrets.PAT_TOKEN }}
          pr_reviewer: grafreak0
          pr_label: |
            automated
            dev-to-main