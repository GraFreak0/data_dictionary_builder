name: Dev to Main PR

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head dev \
            --title "Dev → Main Sync" \
            --body "Auto PR created after updates to dev." \
            --reviewer grafreak0 \
            --label automated \
            --label dev-to-main || echo "PR already exists"