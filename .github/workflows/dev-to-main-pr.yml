name: Dev to Main PR

on:
  push:
    branches:
      - dev

jobs:
  pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: dev
          title: "Dev → Main Sync"
          body: "Auto PR created after updates to dev."
          draft: false
          reviewers: grafreak0
          labels: |
            automated
            dev-to-main
